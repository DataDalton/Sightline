# Databricks Apps deployment manifest.
#
# Declares no values. Everything a deployment needs is set in the app's own
# configuration, next to the resource bindings, where it stays private to that
# deployment and can change without a commit.
#
# A value here would override the configured one, so a placeholder in this file
# is applied rather than ignored, and a `valueFrom` naming a resource that does
# not exist resolves to nothing.

command: ["npm", "run", "start"]

# --- What this app needs ------------------------------------------------------
#
# Set these in the app's configuration, and bind the two resources.
#
# Injected by Databricks, nothing to do:
#   DATABRICKS_HOST, DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET,
#   DATABRICKS_APP_NAME, DATABRICKS_WORKSPACE_ID
#
# From a SQL warehouse resource binding:
#   DATABRICKS_SQL_WAREHOUSE_ID   the warehouse that answers every data query
#
# From a database resource binding, plus a few the binding does not supply:
#   PGHOST                        supplied by the binding
#   PGDATABASE                    the database holding the platform tables
#   LAKEBASE_INSTANCE             the database instance name. Not derivable
#                                 from the host: it is what OAuth credentials
#                                 are minted against, which is a different
#                                 thing from the address you connect to
#   PGSCHEMA                      schema for the platform tables. Dedicated
#                                 rather than public, so they are isolated and
#                                 can be dropped as a unit
#   PGUSER                        optional; falls back to the injected
#                                 service principal client id
#
# For the first administrator:
#   BOOTSTRAP_ADMIN_GROUPS        one group, comma separated for more.
#
#                                 Without it an empty settings table means
#                                 nobody is an administrator, and the page that
#                                 appoints administrators is administrator
#                                 only, so a new deployment could never be
#                                 configured. Once the table names a group this
#                                 is ignored and can be removed.
#
#                                 Case sensitive: membership is matched exactly
#                                 as the account spells it, and the wrong case
#                                 fails silently as a non-member rather than as
#                                 an error.
#
# Optional starting point, overridden by the setting once one is saved:
#   SOURCE_CATALOG                the catalogue the reports read from
#
# Everything else is operational configuration and lives in the platform
# settings table: branding, cache budgets, editor and admin groups, the
# warehouse. All of it is changed under Administration -> Configuration and
# reaches every replica within a refresh interval, with no redeploy.

# --- On behalf of the user ----------------------------------------------------
#
# Not optional for this app. Every data query runs under the caller's own token
# so Unity Catalog applies that person's row filters and column masks, and the
# service principal is deliberately given no access to the analytical views at
# all. Without user authorization there is no identity to query as, and every
# report returns an access error rather than somebody else's rows.
#
# Databricks forwards the token as X-Forwarded-Access-Token once this is
# declared. The sql scope covers both the data queries and the group membership
# probe that resolves a caller's policy class.
#
# Confirm the key and scope names against the Databricks Apps documentation for
# your workspace version.
user_authorization:
    scopes:
        - sql
