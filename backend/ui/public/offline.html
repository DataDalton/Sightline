<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#16181d" />
		<title>Offline</title>
		<style>
			:root {
				color-scheme: light dark;
				--ground: #f7f8fa;
				--text: #16181d;
				--muted: #4a5059;
				--border: #d3d8de;
				--brand: #ffb500;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--ground: #131519;
					--text: #e8eaed;
					--muted: #a8afb9;
					--border: #2f343c;
				}
			}
			* {
				box-sizing: border-box;
				margin: 0;
			}
			body {
				min-height: 100vh;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 24px;
				background: var(--ground);
				color: var(--text);
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					Roboto,
					sans-serif;
				line-height: 1.5;
				text-align: center;
			}
			main {
				display: grid;
				justify-items: center;
				gap: 12px;
				max-width: 34ch;
			}
			svg {
				width: 44px;
				height: 44px;
				color: var(--brand);
			}
			h1 {
				font-size: 21px;
				font-weight: 600;
			}
			p {
				color: var(--muted);
			}
			a {
				margin-top: 8px;
				padding: 10px 18px;
				border: 1px solid var(--border);
				border-radius: 6px;
				color: var(--text);
				font-weight: 600;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<main>
			<svg
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
				aria-hidden="true"
			>
				<path
					d="M2 8.8a15 15 0 0 1 20 0M5 12.9a10 10 0 0 1 14 0M8.5 16.4a5 5 0 0 1 7 0M12 20h.01M3 3l18 18"
				/>
			</svg>
			<h1>You are offline</h1>
			<p>
				Reports and data need a connection. Reconnect and this page will
				load.
			</p>
			<a href="/">Try again</a>
		</main>
	</body>
</html>
